# variables
set -g @color_fg_active    "#82aaff"  # Bright blue (active elements, highlights)
set -g @color_bg_active    "#3b4261"  # Dark blue-gray (active pane background)
set -g @color_bg_inactive  "#1e2030"  # Very dark gray-blue (inactive background)
set -g @color_fg_inactive  "#828bb8"  # Muted gray-blue (inactive text)
set -g @color_bg_status    "#1e2030"  # Status bar background (same as inactive)
set -g @color_fg_session   "#1b1d2b"  # Almost black (session name contrast)

# config reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# set prefix key
set -g prefix C-s

# enable mouse support
set -g mouse on

# set 246 bit color support
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-256color:Tc"


# start window and panes numbering at 1
set -g base-index 1
set -g pane-base-index 1

# Notifying if other windows has activities
setw -g monitor-activity on

# Renumber windows on window close
set -g renumber-windows on

# enable vi based navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# reorder windows 
bind-key m movew -r

# status bar configuration
set -g status-bg default
set-option -g status-position top
set -g status-interval 5

# rename panes to current working directory
set-option -g automatic-rename on
set-option -g automatic-rename-format "#{b:pane_current_path}"

# TokyoNight Theme
set -g mode-style "fg=#{@color_fg_active},bg=#{@color_bg_active}"
set -g message-style "fg=#{@color_fg_active},bg=#{@color_bg_active}"

set -g message-command-style "fg=#{@color_fg_active},bg=#{@color_bg_active}"


set -g pane-border-style "fg=#{@color_bg_active}"
set -g pane-active-border-style "fg=#{@color_fg_active}"

set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#{@color_fg_active},bg=#{@color_bg_status}"

set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

# Status bar content
set -g status-left "#[fg=#{@color_fg_session},bg=#{@color_fg_active},bold] #S #[fg=#{@color_fg_active},bg=#{@color_bg_status},nobold,nounderscore,noitalics]"
set -g status-right ""

setw -g window-status-activity-style "underscore,fg=#{@color_fg_inactive},bg=#{@color_bg_status}"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#{@color_fg_inactive},bg=#{@color_bg_status}"
setw -g window-status-format "#[fg=#{@color_bg_status},bg=#{@color_bg_status},nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#{@color_bg_status},bg=#{@color_bg_status},nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#{@color_bg_status},bg=#{@color_bg_active},nobold,nounderscore,noitalics]#[fg=#{@color_fg_active},bg=#{@color_bg_active},bold] #I  #W #F #[fg=#{@color_bg_active},bg=#{@color_bg_status},nobold,nounderscore,noitalics]"

# set of plugins
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tpm"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "~/.tmux/plugins/tpm/tpm"
