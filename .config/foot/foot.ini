################################################################################
#                            Font Configuration                                #
################################################################################
# Set the font to use for the terminal (MesloLGS Nerd Font, size 12)
font=MesloLGS Nerd Font:size=12

################################################################################
#                            Padding Configuration                             #
################################################################################
# Set padding for the terminal window (5px vertical, 10px horizontal)
pad=5x10

################################################################################
#                            Color Scheme Configuration                        #
################################################################################
# Default background and foreground colors for the terminal
[colors]
background=282828   # Dark background color
foreground=ebdbb2   # Light foreground (text) color

################################################################################
#                            Normal Colors                                      #
################################################################################
# Define the standard (non-bright) colors
regular0=282828  # black
regular1=cc241d  # red
regular2=98971a  # green
regular3=d79921  # yellow
regular4=458588  # blue
regular5=b16286  # magenta
regular6=689d6a  # cyan
regular7=a89984  # white

################################################################################
#                            Bright Colors                                      #
################################################################################
# Define the bright colors for text highlighting, etc.
bright0=928374  # bright black (usually dark gray)
bright1=fb4934  # bright red
bright2=b8bb26  # bright green
bright3=fabd2f  # bright yellow
bright4=83a598  # bright blue
bright5=d3869b  # bright magenta
bright6=8ec07c  # bright cyan
bright7=ebdbb2  # bright white (light gray)
